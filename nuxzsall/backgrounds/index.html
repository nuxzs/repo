<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background Gallery</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#070b16;
    --text:#f7f7fb;
    --muted:#b6bfd6;
    --purple:#e79aff;
    --blue:#4361ee;
    --ocean:#1f6fa8;
    --cyan:#8ecae6;
}

html,body{
    min-height:100%;
}

body{
    height:100vh;
    font-family:Segoe UI,Tahoma,Arial,sans-serif;
    background:
        radial-gradient(circle at 16% 16%,rgba(231,154,255,.20),transparent 30%),
        radial-gradient(circle at 86% 82%,rgba(142,202,230,.16),transparent 35%),
        linear-gradient(135deg,#070b16 0%,#0a1a4f 45%,#07101f 100%);
    color:var(--text);
    padding:22px;
    overflow:hidden;
    animation:pageIn .75s ease both;
}

body.page-exit{
    animation:pageOut .5s ease forwards;
}

@keyframes pageIn{
    from{opacity:0;filter:blur(8px);transform:translateY(14px)}
    to{opacity:1;filter:blur(0);transform:translateY(0)}
}

@keyframes pageOut{
    from{opacity:1;filter:blur(0);transform:translateY(0)}
    to{opacity:0;filter:blur(8px);transform:translateY(14px)}
}

.bg-glow{
    position:fixed;
    width:460px;
    height:460px;
    border-radius:50%;
    filter:blur(96px);
    pointer-events:none;
    z-index:0;
    animation:float 9s ease-in-out infinite;
}

.bg-glow.one{
    left:-150px;
    top:-150px;
    background:rgba(231,154,255,.18);
}

.bg-glow.two{
    right:-160px;
    bottom:-160px;
    background:rgba(142,202,230,.16);
    animation-delay:2s;
}

@keyframes float{
    0%,100%{transform:translateY(0) scale(1)}
    50%{transform:translateY(-24px) scale(1.06)}
}

.shell{
    position:relative;
    z-index:1;
    height:calc(100vh - 44px);
    max-width:1120px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:16px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex:0 0 auto;
    animation:slideDown .65s ease both;
}

@keyframes slideDown{
    from{opacity:0;transform:translateY(-16px)}
    to{opacity:1;transform:translateY(0)}
}

.back{
    color:#f1f6ff;
    text-decoration:none;
    border:1px solid rgba(142,202,230,.30);
    background:rgba(142,202,230,.08);
    padding:11px 16px;
    border-radius:14px;
    font-weight:800;
    transition:.25s ease;
}

.back:hover{
    transform:translateY(-2px);
    background:rgba(142,202,230,.15);
}

.badge{
    color:#fff;
    border:1px solid rgba(231,154,255,.26);
    background:rgba(231,154,255,.09);
    padding:10px 15px;
    border-radius:999px;
    font-size:13px;
    font-weight:900;
}

.hero{
    flex:0 0 auto;
    border:1px solid rgba(231,154,255,.22);
    background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.04));
    backdrop-filter:blur(18px);
    border-radius:28px;
    padding:28px;
    box-shadow:
        0 0 65px rgba(142,202,230,.12),
        inset 0 1px 0 rgba(255,255,255,.10);
    animation:cardIn .8s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes cardIn{
    from{opacity:0;transform:translateY(26px) scale(.98)}
    to{opacity:1;transform:translateY(0) scale(1)}
}

h1{
    font-size:clamp(32px,5vw,56px);
    line-height:1;
    margin-bottom:12px;
    background:linear-gradient(135deg,#fff,#e79aff 38%,#8ecae6 82%);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.hero p{
    color:var(--muted);
    font-size:16px;
    line-height:1.6;
    max-width:780px;
}

.tools{
    margin-top:22px;
    display:flex;
    gap:12px;
    align-items:center;
    flex-wrap:wrap;
}

.search{
    flex:1;
    min-width:230px;
    border:1px solid rgba(142,202,230,.26);
    background:rgba(0,0,0,.25);
    color:#fff;
    border-radius:15px;
    padding:14px 16px;
    outline:none;
    font-size:15px;
}

.search:focus{
    border-color:var(--cyan);
    box-shadow:0 0 0 3px rgba(142,202,230,.10);
}

.count{
    border:1px solid rgba(231,154,255,.24);
    background:rgba(231,154,255,.08);
    color:#f0c6ff;
    border-radius:15px;
    padding:14px 16px;
    font-weight:900;
}

.gallery-panel{
    flex:1 1 auto;
    min-height:0;
    border:1px solid rgba(142,202,230,.18);
    border-radius:28px;
    background:rgba(4,9,22,.42);
    backdrop-filter:blur(14px);
    overflow:hidden;
    animation:fadeUp .85s ease .12s both;
}

.image-list{
    height:auto;
    max-height:100%;
    overflow:auto;
    padding:16px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:14px;
    align-items:start;
}

.image-list::-webkit-scrollbar{
    width:10px;
}

.image-list::-webkit-scrollbar-track{
    background:rgba(255,255,255,.04);
}

.image-list::-webkit-scrollbar-thumb{
    background:linear-gradient(#e79aff,#8ecae6);
    border-radius:999px;
}

@keyframes fadeUp{
    from{opacity:0;transform:translateY(22px)}
    to{opacity:1;transform:translateY(0)}
}

.image-card{
    min-height:245px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    overflow:hidden;
    border-radius:20px;
    border:1px solid rgba(142,202,230,.18);
    background:rgba(4,9,22,.58);
    transition:transform .22s ease, border-color .22s ease, box-shadow .22s ease;
}

.image-card:hover{
    transform:translateY(-2px);
    border-color:rgba(142,202,230,.38);
    box-shadow:0 12px 28px rgba(67,97,238,.16);
}

.image-preview{
    height:148px;
    background:#0a1022;
    background-size:cover;
    background-position:center;
    border-bottom:1px solid rgba(142,202,230,.16);
}

.image-info{
    padding:14px 14px 0;
}

.image-name{
    color:#fff;
    font-size:16px;
    font-weight:900;
    line-height:1.35;
}

.image-path{
    margin-top:5px;
    color:#9fa9c8;
    font-size:12px;
    word-break:break-word;
}

.image-actions{
    padding:14px;
    display:flex;
    gap:10px;
}

.image-actions a{
    flex:1;
    text-align:center;
    text-decoration:none;
    color:#fff;
    background:linear-gradient(135deg,#e79aff 0%,#4361ee 55%,#1f6fa8 100%);
    padding:11px 12px;
    border-radius:13px;
    font-weight:900;
    font-size:13px;
}

.image-actions a.secondary-link{
    background:rgba(142,202,230,.10);
    border:1px solid rgba(142,202,230,.28);
}

.footer{
    flex:0 0 auto;
    text-align:center;
    color:#78839d;
    font-size:12px;
    padding-bottom:2px;
}

.hidden{
    display:none !important;
}

@media(max-width:700px){
    body{padding:14px}
    .shell{height:calc(100vh - 28px)}
    .topbar{align-items:flex-start;flex-direction:column}
    .hero{padding:22px}
    .image-list{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="bg-glow one"></div>
<div class="bg-glow two"></div>

<div class="shell">
    <header class="topbar">
        <a class="back transition-link" href="../">← Back to Repositories</a>
        <div class="badge">Kodi Background Files</div>
    </header>

    <section class="hero">
        <h1>Background Gallery</h1>
        <p>
            Preview and download Kodi splash images, wallpapers and fanart.
        </p>

        <div class="tools">
            <input id="searchInput" class="search" type="text" placeholder="Search background image...">
            <div class="count"><span id="imageCount">0</span> Images</div>
        </div>
    </section>

    <main class="gallery-panel">
        <div class="image-list" id="imageList">

            <article class="image-card">
                <div class="image-preview" style="background-image:url('splash.jpg')"></div>
                <div class="image-info">
                    <div class="image-name">Splash</div>
                    <div class="image-path">splash.jpg</div>
                </div>
                <div class="image-actions">
                    <a href="splash.jpg" target="_blank">Open</a>
                    <a class="secondary-link" href="splash.jpg" download>Download</a>
                </div>
            </article>

        </div>
    </main>

    <div class="footer">Created by Nuxzs • Kodi Background Gallery</div>

    <!-- KODI VIRTUAL FILE SYSTEM SCRAPER COMPATIBILITY LAYER -->
    <!-- Hidden from website users. Kodi can still read direct image links. -->
    <div style="display: none; visibility: hidden; opacity: 0; height: 0; width: 0; overflow: hidden;">
        <hr>
        <pre>
<a href="../">../</a>
<a href="splash.jpg">splash.jpg</a>
        </pre>
        <hr>
    </div>

<script>
const imageCount = document.getElementById("imageCount");
const imageCards = document.querySelectorAll("#imageList .image-card");
const searchInput = document.getElementById("searchInput");

imageCount.textContent = imageCards.length;

searchInput.addEventListener("input", () => {
    const q = searchInput.value.trim().toLowerCase();
    let visible = 0;

    imageCards.forEach(card => {
        const text = card.textContent.toLowerCase();
        const show = text.includes(q);
        card.style.display = show ? "flex" : "none";
        if (show) visible++;
    });

    imageCount.textContent = visible;
});

document.querySelectorAll(".transition-link").forEach(link => {
    link.addEventListener("click", function(e){
        e.preventDefault();
        const target = this.href;
        document.body.classList.add("page-exit");
        setTimeout(() => {
            window.location.href = target;
        }, 430);
    });
});
</script>
</div>
</body>
</html>
