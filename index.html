<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kodi Repo Hub</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:Segoe UI,Tahoma,sans-serif;
    background:
        radial-gradient(circle at top left,rgba(212,175,55,.22),transparent 35%),
        radial-gradient(circle at bottom right,rgba(212,175,55,.12),transparent 35%),
        linear-gradient(135deg,#070707,#111827,#050505);
    color:white;
    overflow:hidden;
}

.glow{
    position:absolute;
    width:420px;
    height:420px;
    border-radius:50%;
    background:rgba(212,175,55,.16);
    filter:blur(80px);
    animation:float 8s ease-in-out infinite;
}

.glow.one{
    top:-120px;
    left:-100px;
}

.glow.two{
    bottom:-140px;
    right:-100px;
    animation-delay:2s;
}

@keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-30px)}
}

.wrap{
    position:relative;
    z-index:2;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
}

.card{
    max-width:760px;
    width:100%;
    text-align:center;
    padding:60px 34px;
    border:1px solid rgba(212,175,55,.35);
    border-radius:28px;
    background:rgba(255,255,255,.055);
    backdrop-filter:blur(18px);
    box-shadow:0 0 60px rgba(212,175,55,.18);
    animation:show .8s ease forwards;
}

@keyframes show{
    from{opacity:0;transform:translateY(30px) scale(.98)}
    to{opacity:1;transform:translateY(0) scale(1)}
}

.badge{
    display:inline-block;
    padding:8px 16px;
    border-radius:999px;
    color:#d4af37;
    border:1px solid rgba(212,175,55,.45);
    background:rgba(212,175,55,.08);
    font-size:14px;
    margin-bottom:22px;
}

h1{
    font-size:clamp(42px,8vw,82px);
    line-height:1;
    margin-bottom:22px;
    background:linear-gradient(135deg,#fff2b0,#d4af37,#fff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

p{
    max-width:560px;
    margin:0 auto 36px;
    color:#cfcfcf;
    font-size:18px;
    line-height:1.7;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:16px;
    flex-wrap:wrap;
}

.btn{
    text-decoration:none;
    padding:15px 34px;
    border-radius:14px;
    font-weight:700;
    transition:.25s ease;
}

.primary{
    background:linear-gradient(135deg,#d4af37,#ffe27a);
    color:#090909;
    box-shadow:0 10px 30px rgba(212,175,55,.35);
}

.primary:hover{
    transform:translateY(-3px);
    box-shadow:0 16px 42px rgba(212,175,55,.55);
}

.secondary{
    color:#d4af37;
    border:1px solid rgba(212,175,55,.55);
    background:rgba(212,175,55,.08);
}

.secondary:hover{
    transform:translateY(-3px);
    background:rgba(212,175,55,.16);
}

.footer{
    margin-top:36px;
    color:#777;
    font-size:13px;
}

@media(max-width:600px){
    .card{
        padding:46px 22px;
    }
}
</style>
</head>

<body>
<div class="glow one"></div>
<div class="glow two"></div>

<div class="wrap">
    <div class="card">
        <div class="badge">Kodi Repository Hub</div>

        <h1>All-in-One Repo Links</h1>

        <p>
            A clean hub page for Kodi repository sources.
            Open the repo list page to view all available repository links in one organized place.
        </p>

        <div class="buttons">
            <a class="btn primary" href="nuxzsall/repos.html">Enter Repo List</a>
        </div>

        <div class="footer">
            Hosted with GitHub Pages
        </div>
    </div>
</div>
</body>
</html>
