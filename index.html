<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All-in-One Repo Hub</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#070b16;
    --panel:rgba(20,25,45,.70);
    --panel2:rgba(255,255,255,.055);
    --text:#f7f7fb;
    --muted:#b6bfd6;
    --purple:#e79aff;
    --purple2:#d8b4fe;
    --blue:#4361ee;
    --navy:#0a1a4f;
    --ocean:#1f6fa8;
    --cyan:#8ecae6;
}

html{
    height:100%;
}

body{
    min-height:100vh;
    font-family:Segoe UI,Tahoma,Arial,sans-serif;
    background:
        radial-gradient(circle at 20% 18%,rgba(231,154,255,.25),transparent 30%),
        radial-gradient(circle at 82% 78%,rgba(142,202,230,.18),transparent 34%),
        linear-gradient(135deg,#070b16 0%,#0a1a4f 45%,#07101f 100%);
    color:var(--text);
    overflow:hidden;
}

body.page-enter{
    animation:pageIn .75s ease both;
}

body.page-exit .card{
    animation:cardOut .58s ease forwards;
}

body.page-exit .glow,
body.page-exit .orb{
    opacity:.12;
    transform:scale(.85);
    transition:.58s ease;
}

@keyframes pageIn{
    from{opacity:0}
    to{opacity:1}
}

.glow{
    position:fixed;
    width:460px;
    height:460px;
    border-radius:50%;
    filter:blur(95px);
    pointer-events:none;
    animation:float 8.5s ease-in-out infinite;
}

.glow.one{
    left:-150px;
    top:-150px;
    background:rgba(231,154,255,.20);
}

.glow.two{
    right:-160px;
    bottom:-160px;
    background:rgba(142,202,230,.17);
    animation-delay:2s;
}

.glow.three{
    left:50%;
    top:52%;
    width:340px;
    height:340px;
    background:rgba(67,97,238,.13);
    animation-delay:3.5s;
}

.orb{
    position:fixed;
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--cyan);
    box-shadow:0 0 20px var(--cyan);
    opacity:.5;
    animation:drift 12s linear infinite;
}

.orb.a{left:18%;top:78%;animation-delay:0s}
.orb.b{left:70%;top:24%;background:var(--purple);box-shadow:0 0 20px var(--purple);animation-delay:2s}
.orb.c{left:48%;top:88%;animation-delay:4s}

@keyframes float{
    0%,100%{transform:translateY(0) scale(1)}
    50%{transform:translateY(-24px) scale(1.06)}
}

@keyframes drift{
    0%{transform:translateY(0);opacity:.05}
    35%{opacity:.55}
    100%{transform:translateY(-170px);opacity:0}
}

.wrap{
    position:relative;
    z-index:2;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
}

.card{
    width:min(820px,100%);
    text-align:center;
    padding:64px 34px;
    border:1px solid rgba(231,154,255,.22);
    border-radius:32px;
    background:
        linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));
    backdrop-filter:blur(22px);
    box-shadow:
        0 0 80px rgba(142,202,230,.13),
        0 0 38px rgba(231,154,255,.10),
        inset 0 1px 0 rgba(255,255,255,.11);
    animation:cardIn .9s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes cardIn{
    from{opacity:0;transform:translateY(34px) scale(.965);filter:blur(10px)}
    to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
}

@keyframes cardOut{
    from{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
    to{opacity:0;transform:translateY(-26px) scale(.97);filter:blur(9px)}
}

.badge{
    display:inline-block;
    padding:9px 18px;
    border-radius:999px;
    color:#eef7ff;
    border:1px solid rgba(142,202,230,.36);
    background:rgba(142,202,230,.09);
    font-size:14px;
    font-weight:700;
    margin-bottom:24px;
    letter-spacing:.35px;
}

h1{
    font-size:clamp(42px,8vw,86px);
    line-height:.96;
    margin-bottom:24px;
    background:linear-gradient(135deg,#ffffff 0%,#e79aff 30%,#8ecae6 72%,#ffffff 100%);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 0 42px rgba(142,202,230,.14);
}

p{
    max-width:600px;
    margin:0 auto 40px;
    color:var(--muted);
    font-size:18px;
    line-height:1.75;
}

.buttons{
    display:flex;
    align-items:center;
    justify-content:center;
}

.btn{
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:340px;
    padding:21px 42px;
    border-radius:20px;
    font-size:20px;
    font-weight:900;
    letter-spacing:.35px;
    color:#fff;
    background:linear-gradient(135deg,#e79aff 0%,#4361ee 48%,#1f6fa8 100%);
    border:1px solid rgba(255,255,255,.13);
    box-shadow:
        0 0 44px rgba(231,154,255,.22),
        0 15px 42px rgba(67,97,238,.28);
    transition:.28s ease;
    position:relative;
    overflow:hidden;
}

.btn::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(120deg,transparent,rgba(255,255,255,.22),transparent);
    transform:translateX(-110%);
    transition:.75s ease;
}

.btn:hover{
    transform:translateY(-4px) scale(1.018);
    box-shadow:
        0 0 55px rgba(231,154,255,.32),
        0 19px 52px rgba(67,97,238,.38);
}

.btn:hover::before{
    transform:translateX(110%);
}

.loading-line{
    width:0;
    height:2px;
    margin:32px auto 0;
    border-radius:999px;
    background:linear-gradient(90deg,transparent,#e79aff,#8ecae6,transparent);
    opacity:0;
}

body.page-exit .loading-line{
    animation:loadLine .58s ease forwards;
}

@keyframes loadLine{
    from{width:0;opacity:0}
    to{width:72%;opacity:1}
}

.footer{
    margin-top:34px;
    color:#78839d;
    font-size:13px;
}

@media(max-width:600px){
    .card{padding:48px 22px}
    p{font-size:16px}
    .btn{min-width:0;width:100%;font-size:18px}
}
</style>
</head>
<body class="page-enter">
<div class="glow one"></div>
<div class="glow two"></div>
<div class="glow three"></div>
<div class="orb a"></div>
<div class="orb b"></div>
<div class="orb c"></div>

<div class="wrap">
    <main class="card">
        <div class="badge">Kodi Repository Source Hub</div>
        <h1>All-in-One<br>Repo Links</h1>
        <p>
            Your all-in-one Kodi repository hub. 
			Browse, download, and install repositories directly from Kodi with clean ZIP links.
        </p>

        <div class="buttons">
            <a class="btn transition-link" href="nuxzsall/index.html">Open Repository Hub</a>
        </div>

        <div class="loading-line"></div>
        <div class="footer">Created by Nuxzs • Kodi Repository Hub</div>
    </main>
</div>

<script>
document.querySelectorAll(".transition-link").forEach(link => {
    link.addEventListener("click", function(e){
        e.preventDefault();
        const target = this.href;
        document.body.classList.remove("page-enter");
        document.body.classList.add("page-exit");
        setTimeout(() => {
            window.location.href = target;
        }, 650);
    });
});
</script>
</body>
</html>
